name: peoplecore
version: "1.0.0"
config-version: 2

profile: peoplecore

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Suggested layering. Fellows: build staging → intermediate → marts.
# This is a starting structure, not a constraint — justify any deviation.
# The workforce mart should land at PERSON grain; the record-stitching
# (transfers + rehires) belongs in the intermediate layer, not staging.
models:
  peoplecore:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
