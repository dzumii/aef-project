name: globemart
version: "1.0.0"
config-version: 2

profile: globemart

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Suggested layering. Fellows: build staging → intermediate → marts.
# This is a starting structure, not a constraint — justify any deviation.
#
# The FX-rate dimension you build from the API belongs in staging/intermediate
# (one row per currency × date, forward-filled to a complete daily calendar).
# Land the pulled rates as a seed or staged table so the marts are reproducible.
models:
  globemart:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# If you materialise the API rates as a dbt seed (recommended for reproducibility):
seeds:
  globemart:
    +schema: staging
