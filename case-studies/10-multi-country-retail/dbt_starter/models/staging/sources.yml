version: 2

# Source definitions for the GlobeMart raw sandbox.
# The generator loads these four tables into GLOBEMART.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.
#
# NOTE: every monetary value below is in LOCAL currency. There is no USD column.
# The authoritative FX rates are NOT in this database in a trustworthy form —
# pull them from a free FX API (see data_generator/README.md → "FX rate workflow")
# and model them as a rate dimension you join to sales and inventory.

sources:
  - name: raw
    database: GLOBEMART   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds from 8 countries, as emitted by the source systems. Multi-currency, dirty on purpose."
    tables:
      - name: raw_sales
        description: "One row per sale. LOCAL_AMOUNT is in the store's local currency; SOLD_AT is store-local wall clock (no offset)."
        loaded_at_field: booked_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: sale_id
            description: "Unique per sale row — but watch for re-rung terminal re-syncs."
            # Fellow: is this actually unique + not null? Add tests and find out.
          - name: local_amount
            description: "Sale total in LOCAL_CURRENCY. Do NOT sum across currencies without converting."
          - name: sold_at
            description: "Store-local wall clock. Sometimes null. Decide which date drives the FX rate."

      - name: raw_stores
        description: "One row per store: country, local currency, timezone, and reporting calendar."
        columns:
          - name: store_id
            description: "Unique store identifier."
          - name: timezone
            description: "IANA timezone — use to interpret SOLD_AT if normalising to UTC."
          - name: reporting_calendar
            description: "gregorian or retail_445 — reconcile when rolling up to a group month."

      - name: raw_inventory
        description: "One row per store × category × snapshot. LOCAL_UNIT_COST is in local currency — same FX problem as sales."
        loaded_at_field: snapshot_date
        columns:
          - name: snapshot_id
            description: "Unique snapshot row."

      - name: raw_currency_rates
        description: "PARTIAL, untrusted legacy rate table. Only some currencies, only part of the year, no weekend rows, a few inverted values. Cross-check only — get real rates from the FX API."
        columns:
          - name: currency
            description: "Only CAD/EUR/GBP/JPY present; AUD/INR/BRL absent entirely."
          - name: rate_to_usd
            description: "Intended local-per-USD; a few rows are inverted. Do not trust blind."
