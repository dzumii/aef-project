version: 2

# Source definitions for the Lumen Lyceum raw sandbox.
# The generator loads these four tables into LEARNSPHERE.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.

sources:
  - name: raw
    database: LEARNSPHERE   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds from the learning platform, as emitted by the source systems. Dirty on purpose."
    tables:
      - name: raw_students
        description: "One row per enrolment (student × course). STUDENT_ID is NOT unique here."
        loaded_at_field: last_active_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: enrollment_id
            description: "Unique enrolment identifier (the grain)."
            # Fellow: is this actually unique + not null? Add tests and find out.
          - name: student_id
            description: "The learner. Repeats across enrolments — do not assume unique."

      - name: raw_courses
        description: "One row per course. Static catalogue; LESSON_COUNT drives % thresholds."
        loaded_at_field: created_at
        columns:
          - name: course_id
            description: "Unique course identifier."

      - name: raw_lessons
        description: "One row per lesson-progress event. Out-of-order; can double-log a lesson; COMPLETED_AT goes null on dropped sessions."
        loaded_at_field: started_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: lesson_event_id
            description: "Unique per event."

      - name: raw_assessments
        description: "One row per final-exam attempt. Includes failed retries; SCORE/IS_PASSED null while grading."
        loaded_at_field: submitted_at   # note: graded_at is nullable — consider what freshness means here
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: assessment_attempt_id
            description: "Unique per attempt."
