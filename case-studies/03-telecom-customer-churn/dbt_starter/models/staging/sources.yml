version: 2

# Source definitions for the Northwind Cellular raw sandbox.
# The generator loads these five tables into TELCO_CORE.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.

sources:
  - name: raw
    database: TELCO_CORE   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds, as emitted by the source systems. Dirty on purpose."
    tables:
      - name: raw_subscribers
        description: "One row per subscriber line — billing system's view. May contain duplicate SUBSCRIBER_IDs after SIM swaps."
        loaded_at_field: activated_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: subscriber_id
            description: "Subscriber line identifier."
            # Fellow: is this actually unique? It is the grain of your mart. Test it.

      - name: raw_plans
        description: "Plan reference dimension."
        columns:
          - name: plan_code
            description: "Plan identifier; unique."

      - name: raw_usage
        description: "One row per daily usage-mediation record. Mediation replays batches, so duplicates exist."
        loaded_at_field: usage_date
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: usage_id
            description: "Unique per mediation record."

      - name: raw_support_tickets
        description: "One row per support contact. RESOLVED_AT is sometimes null (open / feed gap)."
        loaded_at_field: opened_at

      - name: raw_payments
        description: "One row per billing charge / top-up. Failed charges may be retried and settle later — use the latest outcome per BILLING_PERIOD."
        loaded_at_field: due_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
