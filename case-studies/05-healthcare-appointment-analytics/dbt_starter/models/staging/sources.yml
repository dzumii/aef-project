version: 2

# Source definitions for the CareGrid raw sandbox.
# The generator loads these four tables into CAREGRID.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.

sources:
  - name: raw
    database: CAREGRID   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds from the scheduling and revenue-cycle systems, as emitted. Dirty on purpose."
    tables:
      - name: raw_patients
        description: "One row per patient. Demographics and home clinic."
        loaded_at_field: registered_at
        columns:
          - name: patient_id
            description: "Unique patient identifier."
            # Fellow: is this actually unique + not null? Add tests and find out.

      - name: raw_doctors
        description: "One row per provider. Some are inactive but still appear on historical visits."
        loaded_at_field: hired_at
        columns:
          - name: doctor_id
            description: "Unique provider identifier."

      - name: raw_appointments
        description: "One row per booked slot. Status keyed inconsistently across locations; reschedules book a new slot and form a chain via the link columns."
        loaded_at_field: booked_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: appointment_id
            description: "Unique per booked slot. Note: double-submit dupes share slot details but carry distinct ids."
          - name: rescheduled_to_id
            description: "Forward link to the slot a reschedule moved to. Verify it reconciles with rescheduled_from_id."

      - name: raw_billing
        description: "One row per billed line. Includes no-show / late-cancel fees on non-attended appointments. Claims often post a later month than service."
        loaded_at_field: posted_at   # note: posting lags service — consider what freshness means here
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 72, period: hour}
