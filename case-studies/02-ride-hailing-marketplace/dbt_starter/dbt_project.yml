name: rideflow
version: "1.0.0"
config-version: 2

profile: rideflow

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Suggested layering. Fellows: build staging → intermediate → marts.
# This is a starting structure, not a constraint — justify any deviation.
models:
  rideflow:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

tests:
  cobalt_mobility_dbt:
    +severity: error  # default
    staging:
      assert_no_future_trips:
        +severity: warn
    intermediate:
      assert_captured_lte_gross_fare:
        +severity: warn
    marts:
      assert_gap_rate_within_bounds:
        +severity: warn
      assert_kpi_months_complete:
        +severity: warn

