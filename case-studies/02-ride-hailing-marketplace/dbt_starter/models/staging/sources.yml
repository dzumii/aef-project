version: 2

# Source definitions for the Cobalt Mobility raw sandbox.
# The generator loads these five tables into RIDEFLOW.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.

sources:
  - name: raw
    database: RIDEFLOW   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds from the ride-hailing marketplace, as emitted by the source systems. Dirty on purpose."
    tables:
      - name: raw_riders
        description: "One row per rider account. ACCOUNT_STATUS is the CRM flag, not a behavioural measure."
        loaded_at_field: signup_at
        columns:
          - name: rider_id
            description: "Unique rider identifier."
            # Fellow: is this actually unique + not null? Add tests and find out.

      - name: raw_drivers
        description: "One row per driver — but DRIVER_ID is reused on re-onboarding, so check that assumption."
        loaded_at_field: onboarded_at
        columns:
          - name: driver_id
            description: "Driver identifier. May appear more than once (re-onboarded drivers)."

      - name: raw_trips
        description: "One row per trip request: completed or cancelled. GROSS_FARE is the leadership GMV input."
        loaded_at_field: requested_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: trip_id
            description: "Unique trip identifier."

      - name: raw_payments
        description: "One row per payment capture ATTEMPT (includes failures, retries, and double-logged captures)."
        loaded_at_field: attempted_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: payment_id
            description: "Unique per attempt."

      - name: raw_driver_incentives
        description: "One row per incentive line. A trip can appear on multiple lines (overlapping campaigns)."
        loaded_at_field: paid_at   # note: weekly batch — consider what freshness means here
