version: 2

models:
  - name: int_trips_enriched
    description: >
      One row per trip, enriched with deduped captured payment, aggregated incentives,
      and USD-converted amounts. Core fact table for all downstream marts.
    columns:
      - name: trip_id
        tests:
          - not_null
          - unique
      - name: trip_classification
        tests:
          - not_null
      - name: gross_fare_usd
        tests:
          - not_null

  - name: int_driver_metrics
    description: >
      One row per driver. Aggregated trip performance, earnings, and incentive totals.
      Incentive totals reconcile to the raw ledger (Driver Ops requirement).
    columns:
      - name: driver_id
        tests:
          - not_null:
              severity: error
          - unique:
              severity: error
      - name: completion_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_rider_activity
    description: >
      One row per rider with four concurrent active-rider definitions.
      Enables each stakeholder to read their own count from the same table.
    columns:
      - name: rider_id
        tests:
          - not_null
          - unique