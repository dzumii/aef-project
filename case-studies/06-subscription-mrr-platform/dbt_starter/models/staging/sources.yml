version: 2

# Source definitions for the StreamNine raw sandbox.
# The generator loads these five tables into STREAMNINE.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.

sources:
  - name: raw
    database: STREAMNINE   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds from the billing + product systems. Dirty on purpose."
    tables:
      - name: raw_plans
        description: "One row per plan in the catalogue (static reference data)."
        columns:
          - name: plan_id
            description: "Unique plan identifier."
            # Fellow: is this the right grain to join prices from? Confirm uniqueness.

      - name: raw_users
        description: "One row per subscriber, carrying current subscription state."
        loaded_at_field: signup_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: user_id
            description: "Unique subscriber identifier."
            # Fellow: is this actually unique + not null? Add tests and find out.
          - name: subscription_status
            description: "active / paused / past_due / cancelled — the heart of the MRR dispute."

      - name: raw_payments
        description: "One row per billing charge ATTEMPT (includes failures, retries, prorations)."
        loaded_at_field: attempted_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: payment_id
            description: "Unique per attempt."

      - name: raw_upgrades
        description: "One row per upgrade event. Mid-cycle moves carry a proration charge."
        loaded_at_field: effective_at
        columns:
          - name: upgrade_id
            description: "Unique upgrade identifier."

      - name: raw_downgrades
        description: "One row per downgrade event. Immediate vs scheduled changes MRR differently."
        loaded_at_field: effective_at
        columns:
          - name: downgrade_id
            description: "Unique downgrade identifier."
