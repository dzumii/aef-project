version: 2

# Source definitions for the LendWell raw sandbox.
# The generator loads these four tables into LENDWELL.RAW.
# Point `database`/`schema` at wherever you ran the generator.
#
# Source freshness is wired as a starting point — tune the thresholds to a
# daily-load SLA and wire them into your orchestration design.

sources:
  - name: raw
    database: LENDWELL   # override per your sandbox
    schema: RAW
    description: "Raw operational feeds, as emitted by the lending core and servicing systems. Dirty on purpose."
    tables:
      - name: raw_applications
        description: "One row per loan application. Only approved apps become loans."
        loaded_at_field: decided_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: application_id
            description: "Unique application identifier."
            # Fellow: is this actually unique + not null? Add tests and find out.

      - name: raw_loans
        description: "One row per funded loan. LOAN_STATUS is the servicer's CURRENT state."
        loaded_at_field: originated_at
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: loan_id
            description: "Unique loan identifier."
          - name: application_id
            description: "FK to raw_applications. Should reference an approved application."

      - name: raw_repayments
        description: "One row per repayment posting against an instalment (posted / partial / missed)."
        loaded_at_field: due_date   # note: PAID_AT is null on missed rows — consider what freshness means here
        columns:
          - name: repayment_id
            description: "Unique per posting."
          - name: loan_id
            description: "FK to raw_loans."

      - name: raw_defaults
        description: "One row per loan the collections team has FORMALLY flagged. Maintained by hand; lags the ledger."
        loaded_at_field: flagged_at
        columns:
          - name: default_id
            description: "Unique default-register entry."
          - name: loan_id
            description: "FK to raw_loans. One register entry per defaulted loan — verify it."
